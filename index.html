<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon/faviconCalculadora.png">
    <script src="index.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1 id="titulo">Calculadora</h1>
    <div class="calculadora">
        <input type="text" id="display" readonly>
     <div id="botoes">
        
        
        <button class="botao" onclick="inserirNumero('1')">1</button>
        <button class="botao" onclick="inserirNumero('2')">2</button>
        <button class="botao" onclick="inserirNumero('3')">3</button>
        <button class="botao" onclick="inserirOperador('/')">/</button>
        <button class="botao" onclick="inserirNumero('4')">4</button>
        <button class="botao" onclick="inserirNumero('5')">5</button>
        <button class="botao" onclick="inserirNumero('6')">6</button>
        <button class="botao" onclick="inserirOperador('*')">*</button>
        <button class="botao" onclick="inserirNumero('7')">7</button>
        <button class="botao" onclick="inserirNumero('8')">8</button>
        <button class="botao" onclick="inserirNumero('9')">9</button>
        <button class="botao" onclick="inserirOperador('-')">&#8211;</button>
        <button class="botao" onclick="limpar()">C</button>
        <button class="botao" onclick="inserirNumero('0')">0</button>
        <button class="botao" onclick="inserirDecimal('.')">.</button>
        <button class="botao" onclick="inserirOperador('+')">+</button>
        <button id="igual" class="botao" onclick="calcular()">=</button>
        
     </div>
    </div>
</body>
</html>
